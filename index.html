<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video App</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdTvyKuVW8Y1GiQj4M62-WVuXUf-JnGkc",
    authDomain: "my-tiktok-app-7c4a4.firebaseapp.com",
    projectId: "my-tiktok-app-7c4a4",
    storageBucket: "my-tiktok-app-7c4a4.firebasestorage.app",
    messagingSenderId: "609416072426",
    appId: "1:609416072426:web:14086473143cb8eead1b93"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ---- Screen switching ----
  window.showWelcome = function() {
    setScreen('welcomeScreen');
  };
  window.showSignupEmail = function() {
    setScreen('signupScreen');
  };
  window.showLogin = function() {
    setScreen('loginScreen');
  };
  window.showApp = function() {
    setScreen('appScreen');
  };

  function setScreen(id) {
    ['welcomeScreen','signupScreen','loginScreen','appScreen'].forEach(s => {
      document.getElementById(s).style.display = (s === id) ? 'flex' : 'none';
    });
  }

  // ---- Signup ----
  window.signup = function() {
    const name = document.getElementById('name').value.trim();
    const nickname = document.getElementById('nickname').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('suEmail').value.trim();
    const password = document.getElementById('suPassword').value;

    if (!name || !nickname || !username || !email || !password) {
      showMsg('signupMsg', "সব ঘর পূরণ করুন");
      return;
    }
    if (password.length < 6) {
      showMsg('signupMsg', "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে");
      return;
    }

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        return updateProfile(userCredential.user, {
          displayName: name + " | @" + username + " | " + nickname
        });
      })
      .then(() => {
        showMsg('signupMsg', "অ্যাকাউন্ট তৈরি হয়েছে! লগইন করা হচ্ছে...", true);
      })
      .catch((error) => {
        if (error.code === 'auth/email-already-in-use') {
          showMsg('signupMsg', "এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে। Log in করুন।");
        } else if (error.code === 'auth/invalid-email') {
          showMsg('signupMsg', "ইমেইলটি সঠিক ফরম্যাটে লিখুন");
        } else if (error.code === 'auth/weak-password') {
          showMsg('signupMsg', "পাসওয়ার্ড দুর্বল, আরেকটু শক্তিশালী দিন");
        } else {
          showMsg('signupMsg', "সমস্যা হয়েছে: " + error.message);
        }
      });
  };

  // ---- Login ----
  window.login = function() {
    const email = document.getElementById('liEmail').value.trim();
    const password = document.getElementById('liPassword').value;

    if (!email || !password) {
      showMsg('loginMsg', "ইমেইল ও পাসওয়ার্ড দিন");
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
          showMsg('loginMsg', "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে");
        } else if (error.code === 'auth/user-not-found') {
          showMsg('loginMsg', "এই ইমেইলে কোনো অ্যাকাউন্ট নেই, আগে Sign up করুন");
        } else if (error.code === 'auth/too-many-requests') {
          showMsg('loginMsg', "অনেকবার ভুল চেষ্টা হয়েছে, কিছুক্ষণ পর আবার চেষ্টা করুন");
        } else {
          showMsg('loginMsg', "সমস্যা হয়েছে: " + error.message);
        }
      });
  };

  window.logout = function() {
    signOut(auth);
  };

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.innerText = text;
    el.style.color = ok ? '#25d366' : '#fe2c55';
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('userLabel').innerText = user.displayName || user.email;
      window.showApp();
    } else {
      window.showWelcome();
    }
  });
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, Roboto, Arial, sans-serif; }
  body {
    background: #fff;
    color: #161823;
    min-height: 100vh;
  }
  .screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .topbar { display: flex; justify-content: flex-end; }
  .topbar span { font-size: 22px; color: #161823; cursor: pointer; }
  h1.title { font-size: 26px; font-weight: 700; margin: 24px 0 28px; }
  input {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    border-radius: 4px;
    border: 1px solid #d0d1d6;
    font-size: 15px;
    background: #f1f1f2;
  }
  label { display:block; font-size: 12px; color: #75767a; margin-top: 14px; margin-bottom: 2px; }
  .btn-primary {
    width: 100%;
    padding: 14px;
    margin: 18px 0 10px;
    border-radius: 26px;
    border: none;
    background: #fe2c55;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  .btn-outline {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 26px;
    border: 1px solid #d0d1d6;
    background: #fff;
    color: #161823;
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #75767a;
    font-size: 13px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid #e4e4e6;
  }
  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }
  .bottom-link {
    text-align: center;
    margin-top: auto;
    padding-top: 30px;
    font-size: 14px;
    color: #161823;
  }
  .bottom-link a { color: #fe2c55; font-weight: 600; text-decoration: none; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 6px; }
  .back { font-size: 22px; cursor: pointer; margin-bottom: 10px; }

  /* App/home screen */
  #appScreen { background:#000; color:#fff; align-items:center; justify-content:center; text-align:center; }
  #appScreen h2 { font-size: 22px; margin-bottom: 10px; }
  #appScreen p { color:#aaa; margin-bottom: 24px; }
  #appScreen button { background:#fe2c55; color:#fff; border:none; border-radius:26px; padding:12px 28px; font-size:15px; font-weight:600; }
</style>
</head>
<body>

  <!-- Welcome screen -->
  <div id="welcomeScreen" class="screen" style="display:flex;">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
      <div style="font-size:42px;">🎬</div>
      <h1 class="title" style="margin-top:16px;">My Video App</h1>
      <button class="btn-primary" style="max-width:280px;" onclick="showSignupEmail()">Sign up</button>
      <button class="btn-outline" style="max-width:280px;" onclick="showLogin()">Log in</button>
    </div>
  </div>

  <!-- Sign up screen -->
  <div id="signupScreen" class="screen">
    <div class="topbar">
      <span onclick="showWelcome()">&times;</span>
    </div>
    <h1 class="title">Sign up</h1>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Full Name">

    <label>Nickname</label>
    <input type="text" id="nickname" placeholder="Nickname">

    <label>Username</label>
    <input type="text" id="username" placeholder="Username">

    <label>Email</label>
    <input type="email" id="suEmail" placeholder="Email">

    <label>Password</label>
    <input type="password" id="suPassword" placeholder="Password (কমপক্ষে ৬ অক্ষর)">

    <p id="signupMsg" class="msg"></p>

    <button class="btn-primary" onclick="signup()">Sign up</button>

    <div class="divider">or</div>
    <button class="btn-outline" disabled style="opacity:0.5;">🔍 Continue with Google (শীঘ্রই আসছে)</button>

    <p class="bottom-link">Already have an account? <a href="#" onclick="showLogin()">Log in</a></p>
  </div>

  <!-- Login screen -->
  <div id="loginScreen" class="screen">
    <div class="topbar">
      <span onclick="showWelcome()">&times;</span>
    </div>
    <h1 class="title">Log in</h1>

    <label>Email</label>
    <input type="email" id="liEmail" placeholder="Email">

    <label>Password</label>
    <input type="password" id="liPassword" placeholder="Password">

    <p id="loginMsg" class="msg"></p>

    <button class="btn-primary" onclick="login()">Log in</button>

    <div class="divider">or</div>
    <button class="btn-outline" disabled style="opacity:0.5;">🔍 Continue with Google (শীঘ্রই আসছে)</button>

    <p class="bottom-link">Don't have an account? <a href="#" onclick="showSignupEmail()">Sign up</a></p>
  </div>

  <!-- Logged-in app screen -->
  <div id="appScreen" class="screen">
    <h2>স্বাগতম, <span id="userLabel"></span> 👋</h2>
    <p>আপনি সফলভাবে লগইন করেছেন।</p>
    <button onclick="logout()">Log out</button>
  </div>

</body>
</html>
